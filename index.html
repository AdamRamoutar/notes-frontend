<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="register-container" style="display: none;">
        <h2>Register</h2>

        <form id="register-form-id">
            <!--email field-->
            <div>
                <label for="register-email">Email</label>
                <input type= "text" id="register-email" name="register-email" placeholder="Enter email" required>
            </div>

            <!--password field-->
            <div>
                <label for="register-password">Password</label>
                <input type="password" id="register-password" name="register-password" placeholder="Enter password" required>
            </div>

            <!--submit button-->
            <button class="register-btn" type="submit">Register</button>

            <br>
            <p class="toggle-text">
                Have an account? <a href="#" id="login-link">Login here</a>
            </p>

            <!--end of form-->
        </form>
    </div>

    <div class="login-container" style="display: block;">
        <h2>Login</h2>

        <form id="login-form-id">

            <!--email field-->
            <div>
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Enter email" required>
            </div>

            <!--password field-->
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <!--submit button-->

            <button class="login-btn" type="submit">Login</button>
            <br>
            <p class="toggle-text">
                Don't have an account? <a href="#" id="register-link">Register here</a>
            </p>

            <!--end of form-->
        </form>

        
    </div>

    <!--hidden list of notes-->
    <div class="notes-container" style="display: none;">
        <h2>Your Notes</h2>
        
        <ul class="notes-list">
            <li>Note 1</li>
            <li>Note 2</li>
            <li>Note 3</li>
        </ul>

        <!--add note form-->
        <div id="add-note">
            <!--Add note btn-->
            <br>
            <button class="addNote-btn" type="submit">Add note</button>
            <br>
            <!--Entering new note title-->
            <label for="newNoteTitle">Title</label>
            <input type="text" id="newNoteTitle" name="newNoteTitle" placeholder="Enter new note title">
            <br>
            <!--Entering new note-->
            <label for="newNote">Note</label>
            <input type="text" id="newNote" name="newNote" placeholder="Enter new note">

            <button class="logout-btn" type="submit" style="display: none;">Logout</button>
            <button class="cancel-btn" style = "display: none;">Cancel</button>
        </div>
    </div>

    <script>

        const API_URL = window.location.hostname === '127.0.0.1' ? 'http://localhost:3000' : 'https://notes-api-86ah.onrender.com';

        let editingNoteId = null;
        let deleteNoteId = null;

        const registerLink = document.getElementById('register-link');
        registerLink.addEventListener('click', function (event) {
            event.preventDefault();
            document.querySelector('.login-container').style.display = 'none';
            document.querySelector('.register-container').style.display = 'block';
        });
       
        document.getElementById('register-form-id').addEventListener('submit', async function (event) {

            event.preventDefault();

            const userEmail = document.getElementById('register-email').value;
            const userPassword = document.getElementById('register-password').value;

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({email: userEmail, password: userPassword})
                });

                if(response.status === 409) {
                    alert('Email already exists. Please use a different email.');
                    return;
                }

                if(!response.ok){
                    throw new Error('Registration Failed');
                }

                const result = await response.json();
                alert('Registration successful! You can now log in.');
                document.querySelector('.register-container').style.display = 'none';
                document.querySelector('.login-container').style.display = 'block';
                document.getElementById('register-email').value = '';
                document.getElementById('register-password').value = '';

            }
            catch (err) {
                console.error(err);
                alert('Registration failed. Please try again.');
            }

        });

        const loginLink = document.getElementById('login-link');
        loginLink.addEventListener('click', function (event) {
            event.preventDefault();
            document.querySelector('.login-container').style.display = 'block';
            document.querySelector('.register-container').style.display = 'none';
        });

        document.getElementById('login-form-id').addEventListener('submit', async function (event) {
            
            event.preventDefault();

            const userEmail = document.getElementById('email').value;
            const userPassword = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({email: userEmail, password: userPassword})
                });

                if(!response.ok){
                    throw new Error('Login Failed');
                }

                const result = await response.json();

                if(result.token) {
                    localStorage.setItem('token', result.token);
                }

                document.querySelector('.login-container').style.display = 'none';
                document.querySelector('.notes-container').style.display = 'block';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';

                await loadNotes();

            }
            catch (err) {
                console.error(err);
                alert('Login failed. Please check your credentials and try again.');
            }
        });

        async function loadNotes() {
            try{
                const token = localStorage.getItem('token');
                
                if(!token) {
                    throw new Error('No token, please log in');
                }

                 const response = await fetch(`${API_URL}/notes`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if(!response.ok) {
                    if(response.status ===401) {
                        localStorage.removeItem('token');
                    }
                    throw new Error('Failed to fetch protected data');
                }

                const data = await response.json();

                const notesList = document.querySelector('.notes-list');
                notesList.innerHTML = '';
            
                data.forEach(note => {
                    const li = document.createElement('li');
                    li.dataset.id = note.id;
                    const titleSpan = document.createElement('span');
                    const contentSpan = document.createElement('span');

                    titleSpan.textContent = `${note.title}:`;
                    titleSpan.style.marginRight = '10px';

                    contentSpan.textContent = note.content;
                    contentSpan.style.marginRight = '15px';

                    li.appendChild(titleSpan);
                    li.appendChild(contentSpan);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = 'Delete';

                    const editBtn = document.createElement('button');
                    editBtn.textContent = 'Edit';
                    


                    deleteBtn.addEventListener('click', async function () {

                        try {
                            const deleteResponse = await fetch(`${API_URL}/notes/${note.id}`, {
                                method: 'DELETE',
                                headers: {
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                                }
                            });

                            if(!deleteResponse.ok) {
                                throw new Error('Failed to delete note');
                            }

                            deleteNoteId = note.id;
                            
                            if(editingNoteId===deleteNoteId){
                                editingNoteId = null;
                                document.getElementById('newNoteTitle').value = '';
                                document.getElementById('newNote').value = '';
                                document.querySelector('.addNote-btn').textContent = 'Add note';
                                document.querySelector('.cancel-btn').style.display = "none";
                                li.remove();
                                deleteNoteId = null;
                            }
                            else {
                                li.remove();
                                deleteNoteId = null;
                            }

                            
                        }
                        catch(err) {
                            console.error(err);
                            alert('Failed to delete note. Please try again later.');
                        }
                    });

                    editBtn.addEventListener('click' , function () {
                        document.querySelector('.cancel-btn').style.display = 'block';
                        editingNoteId = note.id;
                        document.getElementById('newNoteTitle').value = `${note.title}`;
                        document.getElementById('newNote').value = `${note.content}`;
                        document.querySelector('.addNote-btn').textContent = 'Save';
                    });

                    
                    li.appendChild(deleteBtn);
                    li.appendChild(editBtn);
                    notesList.appendChild(li);
                    
                });

                document.querySelector('.logout-btn').style.display = 'block';
            }
            catch(err){
                console.error(err);
                alert('Failed to fetch notes. Please try again later.');
            }
        };

        document.querySelector('.cancel-btn').addEventListener('click', function () {
            editingNoteId = null;
            document.querySelector('.cancel-btn').style.display = "none";
            document.getElementById('newNoteTitle').value = '';
            document.getElementById('newNote').value = '';
            document.querySelector('.addNote-btn').textContent = 'Add note';

        });

        document.querySelector('.addNote-btn').addEventListener('click', async function (event) {
           
            event.preventDefault();

            const submitBtn = event.currentTarget;

            let method, link;
            ({ method, link } = editingNoteId 
                            ? { method: 'PUT', link: `${API_URL}/notes/${editingNoteId}`} 
                            : { method: 'POST', link: `${API_URL}/notes` });

        
            const newNoteTitle = document.getElementById('newNoteTitle').value;
            const newNoteContent = document.getElementById('newNote').value;

            if(!newNoteTitle || !newNoteContent) {
                alert('Please fill in both title and content for the note.');
                return;
            }
                
            try {
                const token = localStorage.getItem('token');

                if(!token) {
                    throw new Error('No token, please login');
                }

                const response = await fetch(link, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({title: newNoteTitle, content: newNoteContent})
                });

                if(!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                document.querySelector('.addNote-btn').textContent = 'Add note';
                
                editingNoteId = null;
                const result = await response.json();
                console.log('Note added');
                document.getElementById('newNoteTitle').value = '';
                document.getElementById('newNote').value = '';
                
                loadNotes();
            }
            catch(err) {
                console.error(err);
                alert('Failed to add note. Please try again later.');
            }      
        });

        document.querySelector('.logout-btn').addEventListener('click', function (event) {
        
            localStorage.removeItem('token');
            document.querySelector('.login-container').style.display = 'block';
            document.querySelector('.notes-container').style.display = 'none';
            document.getElementById('newNoteTitle').value = '';
            document.getElementById('newNote').value = '';
            document.querySelector('.addNote-btn').textContent = 'Add note';
            document.querySelector('.cancel-btn').style.display = "none";
            const notesList = document.querySelector('.notes-list');
            notesList.innerHTML = '';
        });

    </script>

</body>
</html>
